run = '''
c3c compile solution.c3 -o solution
./solution $input_file $part
'''

[clisp]
packages = ["sbcl"]
run = "sbcl --script solution.lisp $input_file $part"

[clojure]
packages = ["clojure", "openjdk"]
run = "clojure -M -i solution.clj -m solution $input_file $part"

[cpp]
